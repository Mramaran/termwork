<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The agent's term: Unhired, then Active after a DAO hire vote. Active renews by DAO vote, becomes Expired when the term is over, or Fired by DAO vote. Expired can be renewed, hired again or fired. Fired can be hired again. Expiry and firing delete the agent key.">
<defs>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00EC97"/></marker>
</defs>
<rect width="960" height="400" rx="16" fill="#0d1117"/>
<circle cx="52" cy="202" r="8" fill="#e6edf3"/>
<path d="M62 202 H106" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#h)"/>
<path d="M250 202 H376" fill="none" stroke="#00EC97" stroke-width="2.2" marker-end="url(#ha)"/>
<text x="313" y="190" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#00EC97" stroke="#0d1117" stroke-width="5" paint-order="stroke" stroke-linejoin="round">hire</text>
<text x="313" y="222" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#9198a1" stroke="#0d1117" stroke-width="5" paint-order="stroke" stroke-linejoin="round">DAO vote</text>
<path d="M430 244 V292 H510 V249" fill="none" stroke="#00EC97" stroke-width="2.2" marker-end="url(#ha)"/>
<text x="470" y="312" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#00EC97" stroke="#0d1117" stroke-width="5" paint-order="stroke" stroke-linejoin="round">renew (DAO vote)</text>
<path d="M560 178 C 630 178, 640 92, 696 92" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#h)"/>
<text x="664" y="148" text-anchor="start" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#9198a1" stroke="#0d1117" stroke-width="5" paint-order="stroke" stroke-linejoin="round">expire</text>
<text x="664" y="163" text-anchor="start" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#9198a1" stroke="#0d1117" stroke-width="5" paint-order="stroke" stroke-linejoin="round">term over</text>
<path d="M696 64 C 600 40, 500 70, 486 156" fill="none" stroke="#00EC97" stroke-width="2.2" marker-end="url(#ha)"/>
<text x="590" y="40" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#00EC97" stroke="#0d1117" stroke-width="5" paint-order="stroke" stroke-linejoin="round">renew or hire again</text>
<path d="M560 226 C 630 226, 640 312, 696 312" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#h)"/>
<text x="664" y="236" text-anchor="start" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#9198a1" stroke="#0d1117" stroke-width="5" paint-order="stroke" stroke-linejoin="round">fire</text>
<text x="664" y="251" text-anchor="start" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#9198a1" stroke="#0d1117" stroke-width="5" paint-order="stroke" stroke-linejoin="round">DAO vote</text>
<path d="M696 340 C 640 380, 560 380, 540 249" fill="none" stroke="#00EC97" stroke-width="2.2" marker-end="url(#ha)"/>
<text x="640" y="382" text-anchor="middle" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#00EC97" stroke="#0d1117" stroke-width="5" paint-order="stroke" stroke-linejoin="round">hire again</text>
<path d="M820 124 V266" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#h)"/>
<text x="830" y="199" text-anchor="start" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" fill="#9198a1" stroke="#0d1117" stroke-width="5" paint-order="stroke" stroke-linejoin="round">fire</text>
<rect x="110" y="170" width="140" height="64" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
<text x="180" y="198" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Unhired</text>
<text x="180" y="215" text-anchor="middle" font-size="12" fill="#9198a1">no agent key</text>
<rect x="380" y="160" width="180" height="84" rx="10" fill="#0d1117" stroke="#00EC97" stroke-width="2"/>
<text x="470" y="189.5" text-anchor="middle" font-size="15" font-weight="600" fill="#00EC97">Active</text>
<text x="470" y="206.5" text-anchor="middle" font-size="12" fill="#9198a1">the agent key can spend</text>
<text x="470" y="223.5" text-anchor="middle" font-size="12" fill="#9198a1">until the term ends</text>
<rect x="700" y="40" width="220" height="84" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
<text x="810" y="69.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Expired</text>
<text x="810" y="86.5" text-anchor="middle" font-size="12" fill="#9198a1">agent key deleted</text>
<text x="810" y="103.5" text-anchor="middle" font-size="12" fill="#9198a1">DAO can release the budget</text>
<rect x="700" y="270" width="220" height="84" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
<text x="810" y="299.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Fired</text>
<text x="810" y="316.5" text-anchor="middle" font-size="12" fill="#9198a1">agent key deleted</text>
<text x="810" y="333.5" text-anchor="middle" font-size="12" fill="#9198a1">budget returned to the DAO</text>
</svg>
