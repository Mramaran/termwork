[package]
name = "termwork_mandate"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
near-workspaces = "0.24"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
# near-workspaces pulls in native-tls; WSL/Linux boxes often lack pkg-config, so build openssl from source.
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
